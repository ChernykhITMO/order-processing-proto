syntax = "proto3";

package orders.v1;

option go_package = "github.com/ChernykhITMO/order-processing-proto/gen/go/opp/orders/v1;ordersv1";

import "google/protobuf/timestamp.proto";
import "google/type/money.proto";
import "buf/validate/validate.proto";

service OrdersService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc ListUserOrders(ListUserOrdersRequest) returns (stream Order);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;

  reserved 2, 3;
  reserved "ORDER_STATUS_PROCESSED";
  reserved "ORDER_STATUS_CANCELLED";
}

message OrderItem {
  int64 product_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
  google.type.Money price = 3 [(buf.validate.field).required = true];
}

message Order {
  int64 order_id = 1;
  int64 user_id = 2;
  OrderStatus status = 3;
  repeated OrderItem items = 4;
  google.type.Money total_amount = 5;

  google.protobuf.Timestamp created_at = 6;
}

message CreateOrderRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
  repeated OrderItem items = 2 [(buf.validate.field).repeated.min_items = 1];
}

message CreateOrderResponse {
  int64 order_id = 1;
}

message GetOrderRequest {
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetOrderResponse {
  int64 order_id = 1;
  Order order = 2;
}

message ListUserOrdersRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
}
